<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>School Festival Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div id="intro">
    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>
    <div id="sun"></div>
    <div id="moon"></div>
    <h1>School Festival Map</h1>
    <p>Finding your way around the festival…</p>
  </div>

  <div id="map"></div>

  <div id="controls">
    <button id="day-button" class="active">Day</button>
    <button id="night-button">Night</button>
  </div>

  <div id="stall-panel" class="hidden">
    <button id="close-panel">×</button>
    <h2 id="stall-name"></h2>
    <p id="stall-description"></p>
    <p id="stall-category"></p>
    <p id="route-info"></p>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
